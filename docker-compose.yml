services:
  postgres:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: flowstate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: flowstate
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U flowstate -d flowstate']
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://flowstate:${POSTGRES_PASSWORD}@postgres:5432/flowstate
    depends_on:
      postgres:
        condition: service_healthy
  web:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: web
      args:
        NEXT_PUBLIC_COLLABORATION_URL: ${NEXT_PUBLIC_COLLABORATION_URL:-ws://localhost:1234}
        NEXT_PUBLIC_RUNNER_URL: ${NEXT_PUBLIC_RUNNER_URL:-ws://localhost:1236}
    environment:
      DATABASE_URL: postgresql://flowstate:${POSTGRES_PASSWORD}@postgres:5432/flowstate
      COLLABORATION_SECRET: ${COLLABORATION_SECRET:?Set a random secret of at least 32 characters}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      APP_URL: ${APP_URL:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-}
      GITHUB_TOKEN_KEY: ${GITHUB_TOKEN_KEY:-}
      RUNNER_ENABLED: ${RUNNER_ENABLED:-false}
      RUNNER_INTERNAL_URL: ${RUNNER_INTERNAL_URL:-http://127.0.0.1:1236}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
  collaboration:
    restart: unless-stopped
    init: true
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
      target: collaboration
    environment:
      DATABASE_URL: postgresql://flowstate:${POSTGRES_PASSWORD}@postgres:5432/flowstate
      COLLABORATION_SECRET: ${COLLABORATION_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_TOKEN_KEY: ${GITHUB_TOKEN_KEY:-}
    ports:
      - '127.0.0.1:${COLLABORATION_PUBLIC_PORT:-1234}:1234'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:1234/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
